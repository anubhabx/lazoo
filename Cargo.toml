[workspace]
resolver = "2"
members = [
  "crates/lazoo-protocol",
  "crates/lazoo-domain",
  "crates/lazoo-runtime",
  "crates/lazoo-store",
  "crates/lazoo-ipc",
  "crates/lazoo-providers",
  "apps/lazood",
  "apps/lazooctl",
  "apps/lazoo-keeper",
  "apps/lazoo-desktop",
  "apps/lazoo-session-host",
  "tests/fixtures/crashing-daemon",
  "tests/fixtures/job-containment",
  "tests/fixtures/session-tree",
  "tests/fixtures/turn-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
hmac = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = "2.11.5"
tauri-build = "2.6.3"
tempfile = "3.27.0"
toml = "0.9.12"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
winreg = "0.55.0"
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "Foundation",
  "Security_Cryptography_DataProtection",
  "Storage_Streams",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
