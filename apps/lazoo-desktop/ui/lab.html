<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { background: #181b21; color: #ccd; font: 12px Inter, sans-serif; margin: 24px; }
      .row { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; }
      canvas { image-rendering: pixelated; border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="out"></div>
    <script type="module">
      import { glyphModel, paintGlyph, onTick } from "/src/lib/dither.ts";
      const hues = { "claude-code": [183,162,240], codex: [102,195,200], opencode: [125,184,242], antigravity: [109,201,161], "github-copilot": [233,169,144] };
      const names = ["atlas","forge","pixel","sentinel","scout","dash","mira","rune","kit","ash","nova","quill"];
      const motions = ["still","working","thinking","attention"];
      const out = document.getElementById("out");
      const painters = [];
      for (const size of [20, 30, 60]) {
        for (const motion of motions) {
          const row = document.createElement("div"); row.className = "row";
          const label = document.createElement("div"); label.textContent = size + " " + motion; label.style.width = "90px"; row.append(label);
          names.forEach((name, i) => {
            const provider = Object.keys(hues)[i % 5];
            const cell = document.createElement("div"); cell.className = "cell";
            const c = document.createElement("canvas"); c.width = size * devicePixelRatio; c.height = size * devicePixelRatio; c.style.width = c.style.height = size + "px";
            const t = document.createElement("span"); t.textContent = name;
            cell.append(c, t); row.append(cell);
            const hue = hues[provider]; const s = [32,36,44];
            const ink = { hue, ground: s.map((v, k) => Math.round(v + (hue[k] - v) * 0.1)), accent: [141,154,244] };
            const ctx = c.getContext("2d"); const m = glyphModel(name);
            const paint = (time) => paintGlyph(ctx, m, ink, motion, time);
            paint(0.3); if (motion !== "still") painters.push(paint);
          });
          out.append(row);
        }
      }
      onTick((t) => painters.forEach((p) => p(t)));
    </script>
  </body>
</html>
